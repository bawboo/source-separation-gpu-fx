[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htdemucs-gpu-fx"
version = "0.1.0.dev1"
description = "GPU streaming reference and VST3 prototype for full HTDemucs"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
